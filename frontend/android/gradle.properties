# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Increased heap for faster builds and lower-end machine support
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel project execution for faster builds
org.gradle.parallel=true

# Enable Gradle build cache (skip re-compiling unchanged modules)
org.gradle.caching=true

# Configure on demand (only configure needed projects)
org.gradle.configureondemand=true

# Increase daemon idle timeout
org.gradle.daemon.idletimeout=3600000

# AndroidX package structure
android.useAndroidX=true

# Enable R8 full mode for smaller, faster APK
android.enableR8.fullMode=false

# Jetifier for AndroidX compatibility
android.enableJetifier=true

# Non-transitive R classes (faster build, less memory)
android.nonTransitiveRClass=true

