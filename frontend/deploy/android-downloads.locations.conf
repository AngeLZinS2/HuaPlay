# ==============================================================================
# HuaPlay Mobile - Snippet Nginx para inclusão no server block de produção
# Destinado a https://huaplay.playdb.info
# ==============================================================================

# Endpoint público do manifesto de atualização com suporte a CORS (origin nativo: https://huaplay.app)
location = /mobile/version.json {
    try_files $uri =404;
    default_type application/json;

    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Cache-Control" always;

    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Cache-Control" always;
        add_header Content-Length 0;
        add_header Content-Type "text/plain; charset=utf-8";
        return 204;
    }
}

# Download estático dos arquivos de pacote APK do Android
location ^~ /downloads/huaplay/ {
    try_files $uri =404;

    types {
        application/vnd.android.package-archive apk;
    }
    default_type application/vnd.android.package-archive;

    add_header Content-Disposition "attachment" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
